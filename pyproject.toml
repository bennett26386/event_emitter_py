[project]
name = "event-emitter-py"
version = "0.1.0"
description = "Minimal typed event emitter supporting once and off methods, using only the standard library"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
